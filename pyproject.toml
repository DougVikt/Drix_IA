[project]
name = "Drix"
version = "1.0"
description = "Ia portatil , versatil e escalavel"
authors = [
    {name = "dougvikt"}
]
license = "mit"
requires-python = ">=3.10,<3.14.0"
dependencies = [
    "langchain (>=1.3.4,<2.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "openai (>=2.41.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "pyautogui (>=0.9.54,<0.10.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "onnxruntime (==1.16.3)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "customtkinter (>=5.2.2,<6.0.0)",
    "openai-whisper (>=20250625,<20250626)",
]

[tool.poetry]
package-mode = false 

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
