[project]
name = "Drix"
version = "0.1.0"
description = "Ia portatil , versatil e escalavel"
authors = [
    {name = "dougvikt"}
]
license = "mit"
requires-python = ">=3.10,<3.14.0"
dependencies = [
    "langchain (>=1.3.9,<2.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "openai (>=2.41.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "pyautogui (>=0.9.54,<0.10.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "onnxruntime (==1.16.3)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "pypdf (>=7.1.0,<8.0.0)",
    "docx2txt (>=0.9,<1.0)",
    "openai-whisper (>=20250625,<20250626)",
    "psutil (>=7.2.2,<8.0.0)",
    "customtkinter (>=6.0.0,<7.0.0)",
    "darkdetect (>=0.8.0,<0.9.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "html2text (>=2025.4.15,<2026.0.0)",
    "imageio-ffmpeg (>=0.6.0,<1.0.0)",
    "yt-dlp (>=2026.10.21,<2027.0.0)",
    "duckduckgo-search (>=8.1.1,<9.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "python-multipart (>=0.0.32,<0.1.0)",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=2.0.0"]
voice = ["pyttsx3>=2.90,<3.0"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"