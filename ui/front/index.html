<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drix · Parado</title>
  <link rel="icon" type="image/png" href="/ia_system/icon/logo_drix2.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0e0e1a; color: #e0e0e0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(92vw, 430px); background: #151525; border: 1px solid #232338;
      border-radius: 16px; padding: 2.4rem 2.2rem; text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 1.1rem; border-radius: 16px;
      background: #1d1d30;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #2b2b44;
    }
    .mark img { width: 46px; height: 46px; object-fit: contain; }
    h1 { margin: 0 0 .55rem; font-size: 1.5rem; font-weight: 650; }
    p { margin: 0; color: #9a9ab0; font-size: .95rem; line-height: 1.55; }
    .status {
      display: inline-flex; align-items: center; gap: .5rem; margin: 1.35rem 0 1.6rem;
      padding: .45rem .85rem; border-radius: 999px;
      background: rgba(255, 92, 92, .1); color: #ff8080; font-size: .82rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5c5c; }
    button {
      width: 100%; border: 0; border-radius: 10px; padding: .75rem 1rem;
      background: #4f8cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #3f7cf0; }
    .hint { margin-top: 1rem; font-size: .78rem; color: #6f6f88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <img src="/ia_system/icon/logo_drix2.png" alt="Drix">
    </div>
    <h1>Drix parado</h1>
    <p>O motor e os serviços foram encerrados.</p>
    <div class="status"><span class="dot"></span> Nenhum serviço ativo</div>
    <button id="closeTab">Fechar esta aba</button>
    <div class="hint">Para usar novamente, abra o atalho do Drix.</div>
  </div>
  <script>
    document.getElementById('closeTab').addEventListener('click', function () {
      try { window.open('', '_self'); window.close(); } catch (e) { }
      setTimeout(function () { window.location.href = 'about:blank'; }, 250);
    });
  </script>
</body>
</html>
